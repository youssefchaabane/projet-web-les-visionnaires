<!DOCTYPE html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <title>Test API - Debug</title>
    <style>
      body {
        font-family: Arial;
        margin: 20px;
        background: #f0f0f0;
      }
      .test-box {
        background: white;
        margin: 10px 0;
        padding: 15px;
        border-radius: 5px;
      }
      .success {
        color: green;
      }
      .error {
        color: red;
      }
      pre {
        background: #f5f5f5;
        padding: 10px;
        overflow-x: auto;
        border-radius: 3px;
      }
    </style>
  </head>
  <body>
    <h1>🔍 Test API Endpoints</h1>

    <div class="test-box">
      <h3>Test 1: categorie_getAll</h3>
      <button onclick="testAPI('categorie_getAll')">Test</button>
      <pre id="result1"></pre>
    </div>

    <div class="test-box">
      <h3>Test 2: produit_getAll</h3>
      <button onclick="testAPI('produit_getAll')">Test</button>
      <pre id="result2"></pre>
    </div>

    <div class="test-box">
      <h3>Test 3: categorie_getById (id=1)</h3>
      <button onclick="testAPIWithParam('categorie_getById', 1)">Test</button>
      <pre id="result3"></pre>
    </div>

    <script>
      function testAPI(action) {
        const url = `/gestion-stock/index.php?action=${action}`;
        console.log("Fetching:", url);

        fetch(url)
          .then((response) => {
            console.log("Response status:", response.status);
            return response.json();
          })
          .then((data) => {
            const resultId = "result" + (action === "categorie_getAll" ? 1 : 2);
            document.getElementById(resultId).innerHTML =
              `<span class="success">✅ Success</span>\n` +
              JSON.stringify(data, null, 2);
          })
          .catch((error) => {
            const resultId = "result" + (action === "categorie_getAll" ? 1 : 2);
            document.getElementById(resultId).innerHTML =
              `<span class="error">❌ Error: ${error.message}</span>\n` +
              error.stack;
            console.error("Fetch error:", error);
          });
      }

      function testAPIWithParam(action, id) {
        const url = `/gestion-stock/index.php?action=${action}&id=${id}`;
        console.log("Fetching:", url);

        fetch(url)
          .then((response) => response.json())
          .then((data) => {
            document.getElementById("result3").innerHTML =
              `<span class="success">✅ Success</span>\n` +
              JSON.stringify(data, null, 2);
          })
          .catch((error) => {
            document.getElementById("result3").innerHTML =
              `<span class="error">❌ Error: ${error.message}</span>\n` +
              error.stack;
            console.error("Fetch error:", error);
          });
      }

      // Auto-test on load
      window.onload = function () {
        console.log("Page loaded. Testing APIs...");
        testAPI("categorie_getAll");
      };
    </script>
  </body>
</html>
